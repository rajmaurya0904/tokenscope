[project]
name = "tokenscope"
version = "0.1.0"
description = "CLI that parses local Claude Code / Codex session JSONL transcripts and reports token spend per tool, repeated file re-reads, oversized tool outputs and cache misses, with concrete suggestions. For heavy agent users who don't know where their tokens go."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rajmaurya0904/tokenscope"
Repository = "https://github.com/rajmaurya0904/tokenscope"
Documentation = "https://github.com/rajmaurya0904/tokenscope#readme"
Issues = "https://github.com/rajmaurya0904/tokenscope/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tokenscope = "tokenscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
